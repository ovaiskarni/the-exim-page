    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          var href = window.location.href.toLowerCase();
          var isStaff = href.indexOf('admin') !== -1 || href.indexOf('staff') !== -1;
          // Fast redirect to theregistree.shop if someone opens registree.ai.studio directly (except admin routes)
          if (window.self === window.top && !isStaff) {
            if (h.indexOf('registree.ai.studio') !== -1) {
              window.location.replace('https://theregistree.shop' + window.location.pathname + window.location.search);
            }
          }
        } catch(e) {}
      })();
    </script>
